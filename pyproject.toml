[project]
name = "lammps-msevb-tests"
version = "0.1.0"
description = "Golden-fixture regression tests for LAMMPS fix msevb"
requires-python = ">=3.11"
dependencies = ["numpy", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msevb_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: layouts needing one partition per EVB state (heavily oversubscribed on a laptop)",
    "examples: cases vendored from examples/PACKAGES/msevb in the LAMMPS fork",
    "bicarbonate: the reactive bicarbonate MS-EVB model",
]
